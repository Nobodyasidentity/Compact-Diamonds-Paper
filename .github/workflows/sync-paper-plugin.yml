name: Sync Paper Plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "datapackplugin/**"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Compact-Diamonds-Paper repo
        uses: actions/checkout@v4

      - name: Checkout Compact-Diamonds repo
        uses: actions/checkout@v4
        with:
          repository: Nobodyasidentity/Compact-Diamonds
          token: ${{ secrets.REPO_TOKEN }}
          path: compact-diamonds

      - name: Sync datapackplugin folder
        run: |
          rm -rf compact-diamonds/datapackplugin
          cp -r datapackplugin compact-diamonds/datapackplugin

      - name: Commit and push
        working-directory: compact-diamonds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datapackplugin
          git diff --staged --quiet || git commit -m "chore: sync datapackplugin from Paper support"
          git push
